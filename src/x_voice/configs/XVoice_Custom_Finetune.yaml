# Copy this config and set paths, dataset name, and language list for your data.
hydra:
  run:
    dir: ${ckpts.save_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: D:/datasets/my_xvoice_data  # directory with raw/ or raw.arrow and duration.json
  dataset_type: CustomDatasetPath
  audio_type: raw
  root_dir: null  # optional base directory for relative audio_path entries
  batch_size_per_gpu: 19200
  batch_size_type: frame
  max_samples: 32
  num_workers: 8
  language_sampling_alpha: 0.5  # sample languages proportional to sqrt(total audio hours)

optim:
  epochs: 2
  learning_rate: 2.0e-5
  num_warmup_updates: 1000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: false
 
model:
  name: XVoice_Custom_Finetune
  tokenizer: custom
  tokenizer_path: D:/datasets/my_xvoice_data/vocab.txt
  backbone: DiT
  lang_drop_prob: 0.1
  cond_drop_prob: 0.1
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: true
    conv_layers: 4
    qk_norm: null
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: false
    languages: ["bg", "cs", "da", "de", "el", "en", "es", "et", "fi", "fr", "hr", "hu", "id", "it", "ja", "ko", "lt", "lv", "mt", "nl", "pl", "pt", "ro", "ru", "sk", "sl", "sv", "th", "vi", "zh", "bd", "mn", "st", "ck", "gr", "ng"]  # append your dataset language_id values
    text_infill_lang_type: ada
    time_infill_lang_type: time_concat
    use_swiglu: false
    use_rmsnorm: false
    use_ctc: false
    lang_dim: 512
    lang_dim_in_t: 512
    drop_lang_in_time: false
    share_lang_embed: true
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: true
    local_path: D:/models/vocos-mel-24khz

ckpts:
  logger: null
  log_samples: false
  save_per_updates: 1000
  keep_last_n_checkpoints: 3
  last_per_updates: 5000
  save_dir: ckpts/${model.name}_${model.tokenizer}_${datasets.name}
  pretrained_path: D:/models/xvoice/model.safetensors
  pretrained_languages: ["bg", "cs", "da", "de", "el", "en", "es", "et", "fi", "fr", "hr", "hu", "id", "it", "ja", "ko", "lt", "lv", "mt", "nl", "pl", "pt", "ro", "ru", "sk", "sl", "sv", "th", "vi", "zh"]  # original checkpoint language order; do not append here
  freeze_update: null
  continue_training: true
